<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WSA Social Auto-Pilot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --line: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-area h1 {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-paused { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }
    .stat-label {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 600;
    }

    /* Active Task Card */
    .task-card {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .task-card.idle {
      background: var(--card-bg);
      border-color: var(--line);
      color: var(--muted);
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      border: none;
      transition: background .2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover { background: #334155; }

    /* Logs Area */
    .logs-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 6px 0;
      display: flex;
      justify-content: space-between;
    }
    .logs-box {
      background: #020617;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      max-height: 90px;
      overflow-y: auto;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .log-item { margin-bottom: 4px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <img src="icon48.png" style="width:24px; height:24px; border-radius:4px;" alt="Logo">
      <div>
        <h1>WSA Auto-Pilot</h1>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="status-badge" class="badge badge-active">ACTIVE</span>
      <label class="switch">
        <input type="checkbox" id="toggle-autopilot" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Connected Server Auto-Sync Bar -->
  <div style="background:#1e293b; border:1px solid #334155; border-radius:6px; padding:6px 10px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; font-size:11px;">
    <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
      <span id="dot-server-status" style="color:#10b981; font-size:10px;">🟢</span>
      <span style="color:#94a3b8;">Server:</span>
      <span id="label-server-url" style="color:#60a5fa; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px;">Auto-Syncing...</span>
    </div>
    <button id="btn-edit-server" type="button" style="background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:11px;" title="Edit or check Server URL">✏️ Edit</button>
  </div>

  <div id="box-edit-server" style="display:none; background:#020617; border:1px solid #3b82f6; border-radius:6px; padding:8px; margin-bottom:12px;">
    <div style="font-size:10.5px; color:#94a3b8; margin-bottom:4px;">WSA Social Dashboard Base URL:</div>
    <input type="text" id="input-server-url" style="width:100%; padding:6px 8px; font-size:11px; background:#1e293b; color:#fff; border:1px solid #475569; border-radius:4px; margin-bottom:6px; box-sizing:border-box;" placeholder="https://ideal-space-...app.github.dev/">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:10px; color:#10b981;">💡 Auto-syncs when panel is open</span>
      <div style="display:flex; gap:6px;">
        <button id="btn-cancel-server" type="button" style="padding:3px 8px; font-size:10.5px; border-radius:4px; background:#334155; color:#fff; border:none; cursor:pointer;">Cancel</button>
        <button id="btn-save-server" type="button" style="padding:3px 8px; font-size:10.5px; border-radius:4px; background:#2563eb; color:#fff; border:none; cursor:pointer; font-weight:700;">Save</button>
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="stat-queued">-</div>
      <div class="stat-label">Queued</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-shared" style="color:#34d399;">-</div>
      <div class="stat-label">Published</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-pending" style="color:#fbbf24;">-</div>
      <div class="stat-label">Pending</div>
    </div>
  </div>

  <div id="active-task-box" class="task-card idle">
    <div style="font-weight:700; margin-bottom:3px; color:#fff;" id="task-title">Idle / Ready</div>
    <div id="task-desc">No task currently executing.</div>
  </div>

  <button id="btn-run-now" class="btn btn-primary">
    ⚡ Run Next Share Now (Zero-Click)
  </button>

  <a id="btn-open-dashboard" href="http://localhost/wsa-social/index.php?page=groups&tab=queue" target="_blank" class="btn btn-secondary">
    📋 Open WSA Social Dashboard ↗
  </a>

  <div class="logs-header">
    <span>Recent Activity</span>
    <span id="server-time" style="font-weight:normal; text-transform:none;"></span>
  </div>
  <div class="logs-box" id="logs-container">
    <div class="log-item">Extension ready.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
